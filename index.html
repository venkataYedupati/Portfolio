<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio" />
    <meta name="theme-color" content="#000000" />
    <link
      id="site-favicon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2310130f'/%3E%3C/svg%3E"
    />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-source="portfolio-data.json">
    <header class="topbar shell">
      <a class="brand" href="#home" data-brand aria-label="Home"></a>
      <nav class="nav" data-nav aria-label="Primary navigation"></nav>
      <div class="top-actions">
        <a class="btn btn-ghost btn-compact" data-resume-link target="_blank" rel="noreferrer" hidden></a>
      </div>
    </header>

    <main id="home">
      <section class="hero shell" data-reveal>
        <div class="hero-copy">
          <p class="eyebrow" data-hero-eyebrow></p>
          <h1 data-hero-title></h1>
          <p class="hero-summary" data-hero-summary></p>
          <div class="cta-row" data-hero-actions></div>
          <div class="signal-strip" data-hero-signals></div>
        </div>

      </section>

      <aside class="hero-brief shell" aria-label="Engineering profile summary" data-reveal>
        <p class="eyebrow" data-hero-panel-eyebrow></p>
        <h2 data-hero-panel-title></h2>
        <p class="hero-brief-summary" data-hero-panel-summary></p>
        <div class="brief-list" data-hero-panel-items></div>
      </aside>

      <section class="metrics-band" data-reveal>
        <div class="shell">
          <div class="metrics-grid" data-stats></div>
        </div>
      </section>

      <section class="section shell" id="work" data-reveal>
        <div class="section-heading">
          <p class="eyebrow" data-work-eyebrow></p>
          <h2 data-work-title></h2>
          <p data-work-summary></p>
        </div>
        <div class="work-grid" data-projects></div>
      </section>

      <section class="section section-split shell" id="skills" data-reveal>
        <div class="section-heading sticky-heading">
          <p class="eyebrow" data-skills-eyebrow></p>
          <h2 data-skills-title></h2>
          <p data-skills-summary></p>
        </div>
        <div class="skill-grid" data-skills></div>
      </section>

      <section class="section shell" id="experience" data-reveal>
        <div class="section-heading">
          <p class="eyebrow" data-experience-eyebrow></p>
          <h2 data-experience-title></h2>
          <p data-experience-summary></p>
        </div>
        <div class="timeline" data-experience></div>
      </section>

      <section class="section shell" id="education" data-reveal>
        <div class="section-heading">
          <p class="eyebrow" data-education-eyebrow></p>
          <h2 data-education-title></h2>
          <p data-education-summary></p>
        </div>
        <div class="timeline" data-education></div>
      </section>

    </main>

    <footer class="footer" id="contact" data-reveal>
      <div class="shell footer-layout">
        <div class="footer-copy">
          <p class="eyebrow" data-contact-eyebrow></p>
          <h2 data-contact-title></h2>
          <p data-contact-summary></p>
        </div>
        <div class="contact-panel">
          <div class="contact-grid" data-contact-channels></div>
          <div class="social-row" data-social-links></div>
        </div>
      </div>
      <div class="shell footer-bottom">
        <p class="small" data-copyright></p>
      </div>
    </footer>

    <noscript>
      <p class="noscript">Enable JavaScript to load this portfolio.</p>
    </noscript>
    <script src="script.js"></script>
  </body>
</html>
